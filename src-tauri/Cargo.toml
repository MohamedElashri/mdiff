[package]
name = "mdiff"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native code review for macOS and Linux"
repository = "https://github.com/MohamedElashri/mdiff"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
diffle = { path = "../vendor/diffle/crates/diffle", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tempfile = "3"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
url = "2"
sha2 = "0.10"
sha1 = "0.11"
reqwest = { version = "0.13.5", features = ["json"] }
