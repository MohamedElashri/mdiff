name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'Casks/**'
      - 'scripts/update-cask.py'
      - 'tests/test_cask.py'
      - '.github/workflows/homebrew.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'assets/**'
      - 'Casks/**'
      - 'scripts/update-cask.py'
      - 'tests/test_cask.py'
      - '.github/workflows/homebrew.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml
