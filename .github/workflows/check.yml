name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  actions:
    uses: ./.github/workflows/sanad.yml
  desktop:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/diffle/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm run setup
      - run: python3 scripts/release-notes.py
      - run: npm run lint --prefix vendor/diffle
      - run: npm run check
      - run: npm run build:review
      - run: cargo test --locked --manifest-path vendor/diffle/Cargo.toml
