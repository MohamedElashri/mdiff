name: Validate

on:
  workflow_call:
    inputs:
      release-tag:
        description: Validate this tag before preparing a release
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Lint and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check installer and release metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          make lint-metadata
      - uses: MohamedElashri/sanad@v1.0.1
        with:
          mode: check
          base: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/diffle/package-lock.json
      - run: make setup
      - name: Lint and typecheck
        run: |
          make lint typecheck
  installer:
    name: Installer upgrade (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test installation, upgrade, and rollback
        run: make test-installer
  test:
    name: Unit tests and frontend
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/diffle/package-lock.json
      - run: make setup
      - name: Review unit tests
        run: |
          make test-updater test-review
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            src-tauri -> target
            vendor/diffle -> target
          shared-key: unit-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Engine and desktop unit tests
        run: |
          make test-engine test-native
      - name: Build shared frontend
        run: make build-assets
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-frontend
          path: dist/
          if-no-files-found: error
          retention-days: 1
