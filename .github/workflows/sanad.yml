name: Action lock

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: MohamedElashri/sanad@v1.0.1
        with:
          mode: check
          base: ${{ github.event.pull_request.base.sha }}
