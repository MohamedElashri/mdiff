name: Homebrew

on:
  push:
    branches: [main]
    paths: ['Casks/**', 'scripts/update-cask.py', 'tests/test_cask.py', '.github/workflows/homebrew.yml']
  pull_request:
    paths: ['Casks/**', 'scripts/update-cask.py', 'tests/test_cask.py', '.github/workflows/homebrew.yml']

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cask:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/test_cask.py
      - name: Audit cask
        run: |
          brew tap MohamedElashri/mdiff "$GITHUB_WORKSPACE"
          brew trust --cask MohamedElashri/mdiff/mdiff
          brew style MohamedElashri/mdiff/mdiff
          brew audit --cask --strict --arch=all MohamedElashri/mdiff/mdiff
