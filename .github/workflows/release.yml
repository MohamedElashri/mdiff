name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/diffle/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm run setup
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release-notes.py --tag "$RELEASE_TAG"
      - name: Collect target license notices
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
          python3 scripts/native-notices.py
      - name: Build desktop packages
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect release files
        run: python3 scripts/release-artifacts.py '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: mdiff-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mdiff-*
          merge-multiple: true
          path: release-artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/release-notes.py --tag "$RELEASE_TAG" --output release-notes.txt
          cd release-artifacts
          sha256sum ./* > SHA256SUMS
          cd ..
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/mdiff-release-state; then
            test "$(cat /tmp/mdiff-release-state)" = true || { echo 'Refusing to replace a published release'; exit 1; }
            gh release edit "$RELEASE_TAG" --notes-file release-notes.txt
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "mdiff $RELEASE_TAG" --notes-file release-notes.txt
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
