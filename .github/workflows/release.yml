name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      release-tag: ${{ github.ref_name }}
  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    with:
      release: true
  publish:
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: mdiff-*
          merge-multiple: true
          path: release-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          make release-manifest
          cp install.sh LICENCE.md release-artifacts/
          cd release-artifacts
          sha256sum ./* > SHA256SUMS
          cd ..
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/mdiff-release-state; then
            test "$(cat /tmp/mdiff-release-state)" = true || { echo 'Refusing to replace a published release'; exit 1; }
            gh release edit "$RELEASE_TAG" --notes-file release-notes.txt
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "mdiff $RELEASE_TAG" --notes-file release-notes.txt
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
